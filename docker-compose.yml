services:
  postgres:
    image: postgres:16-alpine
    container_name: quizarena-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: quizarena
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: